<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GoalRace — Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="cr">

  <!-- ─── HEADER ─── -->
  <header class="cr__header">
    <div class="cr__logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="6" fill="rgba(0,229,255,0.12)" stroke="rgba(0,229,255,0.35)" stroke-width="1"/>
        <circle cx="14" cy="14" r="7" stroke="#00E5FF" stroke-width="1.5" fill="none"/>
        <circle cx="14" cy="14" r="2.5" fill="#00E5FF"/>
        <line x1="14" y1="4" x2="14" y2="24" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
        <line x1="4" y1="14" x2="24" y2="14" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
      </svg>
      <span>GOALRACE</span><span class="cr__subtitle">CONTROL ROOM</span>
    </div>
    <div class="status-strip">
      <div class="status-pill">
        <span class="status-pip" id="wsStatusPip"></span>
        <span class="status-label">WS</span>
        <span class="badge" id="wsStatus">—</span>
      </div>
      <div class="status-pill">
        <span class="status-pip status-pip--tiktok" id="tiktokStatusPip"></span>
        <span class="status-label">TT</span>
        <span class="badge" id="tiktokStatus">—</span>
      </div>
      <div class="status-pill">
        <span class="status-label">FPS</span>
        <span class="badge" id="fpsCounter">—</span>
      </div>
    </div>
  </header>

  <!-- ─── TOKEN ─── -->
  <div class="panel panel--token">
    <div class="panel__label">ADMIN TOKEN</div>
    <div class="token-row">
      <input id="adminToken" type="password" placeholder="paste your ADMIN_TOKEN"/>
      <button id="saveToken" class="btn btn--sm btn--cyan">Save</button>
    </div>
  </div>

  <!-- ─── LIVE STATS ─── -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-card__value" id="matchStatus">—</div>
      <div class="stat-card__label">Match</div>
    </div>
    <div class="stat-card">
      <div class="stat-card__value" id="timeRemaining">—</div>
      <div class="stat-card__label">Time Left</div>
    </div>
    <div class="stat-card">
      <div class="stat-card__value" id="totalPlayers">0</div>
      <div class="stat-card__label">Players</div>
    </div>
  </div>

  <!-- ─── MATCH CONTROL ─── -->
  <section class="panel">
    <div class="panel__header">
      <div class="panel__icon">⚽</div>
      <div class="panel__title">Match Control</div>
    </div>
    <div class="btn-grid">
      <button class="btn btn--go" data-action="start">Start</button>
      <button class="btn"         data-action="pause">Pause</button>
      <button class="btn"         data-action="resume">Resume</button>
      <button class="btn btn--danger" data-action="reset">Reset</button>
    </div>
    <div class="btn-grid btn-grid--sm">
      <button class="btn btn--sm" data-action="extend" data-payload='{"seconds":30}'>+30s</button>
      <button class="btn btn--sm" data-action="extend" data-payload='{"seconds":60}'>+60s</button>
      <button class="btn btn--sm" data-action="skipHalftime">Skip to Final Surge</button>
    </div>
  </section>

  <!-- ─── STADIUM EVENTS ─── -->
  <section class="panel">
    <div class="panel__header">
      <div class="panel__icon">🎆</div>
      <div class="panel__title">Stadium Events</div>
    </div>
    <div class="btn-grid">
      <button class="btn btn--accent" data-action="fireworks">Fireworks</button>
      <button class="btn btn--accent" data-action="moneygun">Money Gun</button>
      <button class="btn btn--accent" data-action="chaosToggle">Chaos Mode</button>
      <button class="btn btn--sm"     data-action="cameraZoom">Camera Zoom</button>
    </div>
    <div class="led-row">
      <input id="ledInput" type="text" maxlength="60" placeholder="LED jumbotron message…"/>
      <button id="ledSend" class="btn btn--sm btn--cyan">Send</button>
    </div>
  </section>

  <!-- ─── TEST MODE ─── -->
  <section class="panel panel--test">
    <div class="panel__header">
      <div class="panel__icon">🧪</div>
      <div class="panel__title">Test Mode</div>
      <span class="panel__note">No TikTok connection needed</span>
    </div>
    <div class="btn-grid">
      <button class="btn btn--go"     data-action="testStart">▶ Start Test Match</button>
      <button class="btn btn--danger" data-action="testStop">■ Stop Test</button>
    </div>
    <div class="test-grid">
      <button class="btn btn--sm" data-action="simulateLikes" data-payload='{"count":50}'>+50 Likes</button>
      <button class="btn btn--sm" data-action="simulateFollow">Follow</button>
      <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"hn"}'>Join HON</button>
      <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"mx"}'>Join MEX</button>
      <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"br"}'>Join BRA</button>
      <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"us"}'>Join USA</button>
      <button class="btn btn--sm" data-action="simulateGift" data-payload='{"giftKey":"rose"}'>🌹 Rose</button>
      <button class="btn btn--sm btn--accent" data-action="simulateGiftSpam" data-payload='{"giftKey":"rose","count":8}'>🌹 Rose Spam</button>
      <button class="btn btn--sm btn--accent" data-action="simulateGiftSpam" data-payload='{"giftKey":"galaxy","count":5}'>🌌 Galaxy Spam</button>
      <button class="btn btn--sm btn--accent" data-action="simulateBigGift">💰 Money Gun</button>
      <button class="btn btn--sm btn--danger" data-action="simulateConnectionLoss">Drop Connection</button>
      <button class="btn btn--sm btn--go"    data-action="simulateReconnect">Reconnect</button>
    </div>
  </section>

  <!-- ─── TIKTOK LIVE CONNECTION ─── -->
  <section class="panel">
    <div class="panel__header">
      <div class="panel__icon">📡</div>
      <div class="panel__title">TikTok LIVE</div>
    </div>
    <p class="panel__note panel__note--block">Set <code>TIKTOK_USERNAME</code> and <code>TIKTOK_SIGN_API_KEY</code> as Codespaces environment secrets, then connect.</p>
    <div class="btn-grid">
      <button class="btn btn--go" data-action="connectTikTok">Connect to TikTok LIVE</button>
    </div>
  </section>

  <!-- ─── ACTIVITY LOG ─── -->
  <section class="panel">
    <div class="panel__header">
      <div class="panel__icon">📋</div>
      <div class="panel__title">Activity Log</div>
    </div>
    <div id="adminLog" class="log"></div>
  </section>

</div>
<script src="admin.js"></script>
</body>
</html>
