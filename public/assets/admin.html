<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GoalRace — Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="cr">

  <!-- ─── HEADER (full width) ─── -->
  <header class="cr__header">
    <div class="cr__logo">
      <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="6" fill="rgba(0,229,255,0.12)" stroke="rgba(0,229,255,0.35)" stroke-width="1"/>
        <circle cx="14" cy="14" r="7" stroke="#00E5FF" stroke-width="1.5" fill="none"/>
        <circle cx="14" cy="14" r="2.5" fill="#00E5FF"/>
        <line x1="14" y1="4" x2="14" y2="24" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
        <line x1="4" y1="14" x2="24" y2="14" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
      </svg>
      <span>GOALRACE</span><span class="cr__subtitle">CONTROL ROOM</span>
    </div>

    <div class="token-row">
      <input id="adminToken" type="password" placeholder="ADMIN_TOKEN"/>
      <button id="saveToken" class="btn btn--sm btn--cyan">Save</button>
    </div>

    <div class="status-strip">
      <div class="status-pill"><span class="status-pip" id="wsStatusPip"></span><span class="status-label">WS</span><span class="badge" id="wsStatus">—</span></div>
      <div class="status-pill"><span class="status-pip" id="tiktokStatusPip"></span><span class="status-label">TT</span><span class="badge" id="tiktokStatus">—</span></div>
      <div class="status-pill"><span class="status-label">FPS</span><span class="badge" id="fpsCounter">—</span></div>
    </div>
  </header>

  <!-- ─── DASHBOARD GRID ─── -->
  <div class="cr__grid">

    <!-- LEFT COLUMN: two compact panels stacked -->
    <div class="cr__col cr__col--left">

      <section class="panel panel--compact">
        <div class="panel__header">
          <span class="panel__icon">📊</span><span class="panel__title">Live Stats</span>
        </div>
        <div class="stat-mini-grid">
          <div class="stat-mini"><span class="stat-mini__value" id="matchStatus">—</span><span class="stat-mini__label">Match</span></div>
          <div class="stat-mini"><span class="stat-mini__value" id="timeRemaining">—</span><span class="stat-mini__label">Time</span></div>
          <div class="stat-mini"><span class="stat-mini__value" id="totalPlayers">0</span><span class="stat-mini__label">Players</span></div>
        </div>
      </section>

      <section class="panel panel--compact">
        <div class="panel__header">
          <span class="panel__icon">⚽</span><span class="panel__title">Match Control</span>
        </div>
        <div class="btn-grid btn-grid--2col">
          <button class="btn btn--go"     data-action="start">Start</button>
          <button class="btn"             data-action="pause">Pause</button>
          <button class="btn"             data-action="resume">Resume</button>
          <button class="btn btn--danger" data-action="reset">Reset</button>
        </div>
        <div class="btn-grid btn-grid--3col">
          <button class="btn btn--sm" data-action="extend" data-payload='{"seconds":30}'>+30s</button>
          <button class="btn btn--sm" data-action="extend" data-payload='{"seconds":60}'>+60s</button>
          <button class="btn btn--sm" data-action="skipHalftime">Final Surge</button>
        </div>
      </section>

      <section class="panel panel--compact">
        <div class="panel__header">
          <span class="panel__icon">🎆</span><span class="panel__title">Stadium Events</span>
        </div>
        <div class="btn-grid btn-grid--2col">
          <button class="btn btn--accent" data-action="fireworks">Fireworks</button>
          <button class="btn btn--accent" data-action="moneygun">Money Gun</button>
          <button class="btn btn--accent" data-action="chaosToggle">Chaos</button>
          <button class="btn btn--sm"     data-action="cameraZoom">Zoom Cam</button>
        </div>
        <div class="led-row">
          <input id="ledInput" type="text" maxlength="60" placeholder="LED message…"/>
          <button id="ledSend" class="btn btn--sm btn--cyan">Send</button>
        </div>
      </section>

    </div><!-- /left col -->

    <!-- CENTER COLUMN: the big important panel -->
    <div class="cr__col cr__col--center">
      <section class="panel panel--test panel--hero">
        <div class="panel__header">
          <span class="panel__icon">🧪</span><span class="panel__title">Test Mode</span>
          <span class="panel__note">No TikTok needed</span>
        </div>

        <div class="btn-grid btn-grid--2col" style="margin-bottom:10px;">
          <button class="btn btn--go btn--lg"     data-action="testStart">▶ Start Test Match</button>
          <button class="btn btn--danger btn--lg" data-action="testStop">■ Stop Test</button>
        </div>

        <div class="test-section-label">Engagement</div>
        <div class="test-grid">
          <button class="btn btn--sm" data-action="simulateLikes" data-payload='{"count":50}'>+50 Likes</button>
          <button class="btn btn--sm" data-action="simulateFollow">Follow</button>
        </div>

        <div class="test-section-label">Country Joins</div>
        <div class="test-grid test-grid--4col">
          <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"hn"}'>HON</button>
          <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"mx"}'>MEX</button>
          <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"br"}'>BRA</button>
          <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"us"}'>USA</button>
          <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"ar"}'>ARG</button>
          <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"co"}'>COL</button>
          <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"gt"}'>GUA</button>
          <button class="btn btn--sm" data-action="simulateComment" data-payload='{"country":"sv"}'>SAL</button>
        </div>

        <div class="test-section-label">Gifts</div>
        <div class="test-grid">
          <button class="btn btn--sm" data-action="simulateGift" data-payload='{"giftKey":"rose"}'>🌹 Rose</button>
          <button class="btn btn--sm btn--accent" data-action="simulateGiftSpam" data-payload='{"giftKey":"rose","count":8}'>Rose Spam</button>
          <button class="btn btn--sm btn--accent" data-action="simulateGiftSpam" data-payload='{"giftKey":"galaxy","count":5}'>Galaxy Spam</button>
          <button class="btn btn--sm btn--accent" data-action="simulateBigGift">💰 Money Gun</button>
        </div>

        <div class="test-section-label">Connection</div>
        <div class="test-grid">
          <button class="btn btn--sm btn--danger" data-action="simulateConnectionLoss">Drop Connection</button>
          <button class="btn btn--sm btn--go"     data-action="simulateReconnect">Reconnect</button>
        </div>
      </section>
    </div><!-- /center col -->

    <!-- RIGHT COLUMN: connection + activity log -->
    <div class="cr__col cr__col--right">

      <section class="panel panel--compact">
        <div class="panel__header">
          <span class="panel__icon">📡</span><span class="panel__title">TikTok LIVE</span>
        </div>
        <p class="panel__note panel__note--block">
          Set <code>TIKTOK_USERNAME</code> + <code>TIKTOK_SIGN_API_KEY</code> as env secrets, then connect.
        </p>
        <button class="btn btn--go" style="width:100%;" data-action="connectTikTok">Connect to TikTok LIVE</button>
      </section>

      <section class="panel panel--compact panel--log">
        <div class="panel__header">
          <span class="panel__icon">📋</span><span class="panel__title">Activity Log</span>
        </div>
        <div id="adminLog" class="log"></div>
      </section>

    </div><!-- /right col -->

  </div><!-- /grid -->

</div>
<script src="admin.js"></script>
</body>
</html>
